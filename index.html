<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Calculator</title>
    <link rel="stylesheet" href="style.css">
    <script defer src="script.js"></script>
</head>
<body>
    <div class="calculator-container">
        <header>
            <h1> Calculator</h1>
            <button id="themeToggle">Toggle Theme</button>
        </header>
        <div class="calculator">
            <div class="display">
                <input type="text" id="calcDisplay" readonly>
            </div>
            <div class="buttons">
                <!-- Memory Operations -->
                <button class="btn" onclick="memoryClear()">MC</button>
                <button class="btn" onclick="memoryRecall()">MR</button>
                <button class="btn" onclick="memoryStore()">MS</button>
                <button class="btn" onclick="memoryAdd()">M+</button>
                
                <!-- Scientific Operations -->
                <button class="btn" onclick="insertFunction('Math.sin(')">sin</button>
                <button class="btn" onclick="insertFunction('Math.cos(')">cos</button>
                <button class="btn" onclick="insertFunction('Math.tan(')">tan</button>
                <button class="btn" onclick="insertFunction('Math.log(')">log</button>
                
                <!-- Numbers -->
                <button class="btn" onclick="insert(7)">7</button>
                <button class="btn" onclick="insert(8)">8</button>
                <button class="btn" onclick="insert(9)">9</button>
                <button class="btn" onclick="insert('/')">÷</button>
                
                <button class="btn" onclick="insert(4)">4</button>
                <button class="btn" onclick="insert(5)">5</button>
                <button class="btn" onclick="insert(6)">6</button>
                <button class="btn" onclick="insert('*')">×</button>
                
                <button class="btn" onclick="insert(1)">1</button>
                <button class="btn" onclick="insert(2)">2</button>
                <button class="btn" onclick="insert(3)">3</button>
                <button class="btn" onclick="insert('-')">-</button>
                
                <button class="btn" onclick="insert(0)">0</button>
                <button class="btn" onclick="insert('.')">.</button>
                <button class="btn" onclick="clearDisplay()">C</button>
                <button class="btn" onclick="insert('+')">+</button>
                
                <!-- Advanced and Equals -->
                <button class="btn" onclick="insertFunction('Math.sqrt(')">√</button>
                <button class="btn" onclick="calculate()">=</button>
                <button class="btn" onclick="insert('**')">^</button>
                <button class="btn" onclick="insert('(')">(</button>
                <button class="btn" onclick="insert(')')">)</button>
            </div>
        </div>
        <div class="history">
            <h2>History</h2>
            <ul id="historyList"></ul>
        </div>
    </div>
</body>
</html>
